components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: e.g. 2025-26
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
        is_archived:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - name
      - start_date
      - updated_at
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          nullable: true
        actor_email:
          type: string
          readOnly: true
        actor_role:
          type: string
          maxLength: 20
        action:
          type: string
          maxLength: 60
        entity:
          type: string
          maxLength: 60
        object_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        previous_state:
          type: string
          nullable: true
        new_state:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_email
      - entity
      - id
      - timestamp
    CO:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 20
        description:
          type: string
        program:
          type: string
          maxLength: 50
      required:
      - code
      - id
    CompetitionDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        name:
          type: string
          maxLength: 200
        date:
          type: string
          format: date
          nullable: true
        prize:
          type: string
          maxLength: 100
        certificate:
          type: integer
          nullable: true
        description:
          type: string
      required:
      - id
      - name
      - project
    CustomTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 150
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - updated_at
    Document:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        group:
          type: integer
